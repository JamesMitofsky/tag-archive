name: Deploy Command

# Comment `/deploy` on a pull request to publish its head commit as a Vercel
# preview deployment; the bot replies with its URL.
#
# Vercel builds nothing from git but `main` (`git.deploymentEnabled` in
# vercel.json), so this is the only way to get a preview. The CLI uploads the
# checked-out commit and Vercel builds it remotely, on Linux and with the
# project's Preview environment variables, exactly as a git build would. No
# dependencies are installed here, where the token is in scope; the CLI still
# reads the PR's project config, which is why only collaborators may ask.
#
# Previews sit behind Vercel Authentication (the default Deployment
# Protection), so only members of the Vercel team can open one.
#
# GitHub only runs `issue_comment` workflows from the copy of this file on the
# default branch (`main`), so changes here take effect once merged there.
#
# Needs the VERCEL_TOKEN repo secret (a Vercel access token), and the
# VERCEL_ORG_ID and VERCEL_PROJECT_ID repo variables (from the project's
# Settings → General, or `.vercel/project.json` after `vercel link`).
on:
  issue_comment:
    types: [created]

# A newer `/deploy` on the same PR supersedes one still deploying.
concurrency:
  group: deploy-command-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    # Only on PRs, only for an exact `/deploy`, and only from people with write
    # access: the PR's code is deployed with the Vercel token.
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/deploy' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: 1
    steps:
      - name: Acknowledge the command
        run: >-
          gh api --method POST
          "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions"
          -f content=rocket

      # Pin the commit now, so what gets deployed is what the PR held when the
      # command was given. Fork PRs are refused: their code is not ours to run
      # with secrets.
      - name: Resolve the PR head
        id: pr
        run: |
          pr=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
          if [ "$(jq -r .head.repo.full_name <<<"$pr")" != "${{ github.repository }}" ]; then
            echo "::error::PR #$PR_NUMBER comes from a fork; /deploy only runs on branches in this repo."
            exit 1
          fi
          echo "sha=$(jq -r .head.sha <<<"$pr")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          # The deploy needs the files, not a GitHub token left in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Run from outside the checkout, pointed at it with --cwd: npx resolves the
      # CLI with the working directory's npm config, and the PR's own .npmrc
      # must not choose which `vercel` gets the token. The CLI prints the
      # deployment's URL on stdout, and its progress on stderr.
      - name: Deploy
        id: deploy
        working-directory: ${{ runner.temp }}
        env:
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          url=$(npx --yes vercel@64.5.0 deploy --cwd "$GITHUB_WORKSPACE" --yes \
            --token "$VERCEL_TOKEN" \
            --meta "githubPrId=$PR_NUMBER" --meta "githubCommitSha=$SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report the result
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          SHA: ${{ steps.pr.outputs.sha }}
          URL: ${{ steps.deploy.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = success ]; then
            body="Preview for \`${SHA:0:7}\` is live: $URL"
          else
            body="\`/deploy\` failed ($OUTCOME). Logs: $RUN_URL"
          fi
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$body"
