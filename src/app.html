<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Tints the iOS status bar / Android browser chrome with the sky instead of
		     the default white. This is the midday sky (the --sky-0 default in
		     layout.css); the sky engine ($lib/sky) rewrites it as the sun moves. -->
		<meta name="theme-color" content="#94cae7" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
